name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 插件零第三方依赖：不装包，直接跑两个离线自测（宿主半边 + 浏览器半边）。
      # 两步都包一层：日志要登录才看得到，注解不用（见 scripts/ci-run.sh）。
      - name: runtime banner
        shell: bash
        run: node -e "console.log('::notice::node '+process.version+' '+require('os').platform()+'/'+require('os').release()+' tz='+Intl.DateTimeFormat().resolvedOptions().timeZone+' off='+new Date().getTimezoneOffset()+' home='+require('os').homedir()+' tmp='+require('os').tmpdir()+' dsh_home='+(process.env.DSH_HOME??'unset'))"
      - name: host tests
        shell: bash
        run: bash scripts/ci-run.sh node test/host.mjs
      - name: client tests
        shell: bash
        run: bash scripts/ci-run.sh node test/client.mjs

  manifest:
    name: manifest & docs
    runs-on: ubuntu-latest
    steps:
      # check-docs 会核 CHANGELOG 里的 tag 死链，而 checkout 默认是"单层且不带 tag"——
      # 那种克隆里四个 tag 全都"不存在"，检查必然假红。这条 job 要看到真实 ref 才有意义。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: plugin manifest
        run: node scripts/check-manifest.mjs
      - name: README claims match the code
        shell: bash
        run: bash scripts/ci-run.sh node scripts/check-docs.mjs
      - name: packed tarball loads
        shell: bash
        run: |
          set -euo pipefail
          name=$(npm pack --silent | tail -n 1)
          test -f "$name"
          mkdir -p /tmp/unpacked
          tar -xzf "$name" -C /tmp/unpacked
          test -f /tmp/unpacked/package/lib/index.js
          test -f /tmp/unpacked/package/cordis.patch.yml
          test -f /tmp/unpacked/package/LICENSE
          node --input-type=module -e "await import('/tmp/unpacked/package/lib/index.js'); console.log('lib/index.js loads from the published tarball')"
