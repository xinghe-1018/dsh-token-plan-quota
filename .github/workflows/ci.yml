name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 插件零第三方依赖：不装包，直接跑两个离线自测（宿主半边 + 浏览器半边）。
      - name: host tests
        run: node test/host.mjs
      - name: client tests
        run: node test/client.mjs

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: dsh.bundle + cordis.patch.yml present
        run: node scripts/check-manifest.mjs
