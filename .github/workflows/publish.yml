name: publish

# 推 `v*` tag 即发布。版本切分（0.4.4 → 0.4.5）由人决定，机器只负责"确定要发了"之后的部分。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑到打包为止，不真发'
        type: boolean
        default: true

permissions:
  # contents: write 是给 tag push 之后建 GitHub Release 用的（softprops/action-gh-release）。
  # 对 npm OIDC 那条路没有副作用：npmjs 的 Trusted Publisher 只核 workflow 名 + ref，
  # 不看这个 permission。
  contents: write
  # OIDC trusted publishing 要这个：没有它 npm 会报一句很误导人的
  # "Access token expired or revoked" + 404，而不是"我没有身份"。
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      # check-docs 会核 CHANGELOG 里的 compare 链接指向真实 tag，浅克隆里 tag 全"不存在"。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        # 千万不要在这里加 registry-url！setup-node 会往 ~/.npmrc 写
        #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
        # 这行 —— 而 npm 自己**不会**展开 `${...}`，于是 OIDC 发布时它拿着字面串
        # "${NODE_AUTH_TOKEN}" 当 token，直接被 registry 401/404（症状超误导人：
        # 报 "Access token expired or revoked"）。NPM_TOKEN 那条路下面手动写 .npmrc。
        with:
          node-version: '22'

      # runner 自带的 npm 可能不支持 OIDC 发布，症状是 404（见上面那条注释）。
      - name: bump npm on the runner
        run: npm install -g npm@latest

      - name: tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          # 手动触发时 ref 是分支名，没有 tag 可比；以 package.json 为准，且默认是 dry run。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch：以 package.json 的 ${ver} 为准（ref=${GITHUB_REF_NAME}）"
          elif [ "${GITHUB_REF_NAME#v}" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 ${ver} 不一致——拒绝发布"
            exit 1
          else
            echo "::notice::准备发布 ${ver}（tag ${GITHUB_REF_NAME}）"
          fi
          grep -q "^## \[${ver}\]" CHANGELOG.md || { echo "::error::CHANGELOG 没有 ${ver} 这一节"; exit 1; }

      - name: full gate (tests + manifest + README claims + submission)
        run: npm run check

      - name: tarball contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          # 中间产物一旦被 files 白名单收进来就会进包（allowlist 压过 .gitignore，真栽过一次）。
          if grep -Eq '_frames|_debug|\.shots-work' /tmp/pack.log; then
            echo "::error::tarball 里有截图中间产物"; exit 1
          fi
          grep -q 'docs/images/panel-official-plus-meters.png' /tmp/pack.log || { echo "::error::tarball 里没有 README 引用的图"; exit 1; }

      - name: publish
        # 两种鉴权都支持：仓库里配了 NPM_TOKEN 就走 token；没配就走 OIDC trusted publishing。
        # 注意 --provenance 只在 OIDC 下可用，用 token 时不能带（会报"publisher is not trusted"）。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run：跳过发布"
            exit 0
          fi
          # 失败时 npm 会把真实原因写到 stderr —— 但 Actions 的 annotations 只显示
          # "exit code 1"，公开 API 也看不到 raw log。把整段日志按行贴成 ::error::，
          # 这样下次一挂就能直接看清是哪一步被拒（OIDC 没配、token 空、版本重了…）。
          dump_annotations() {
            local f="$1"
            tail -n 30 "$f" | sed 's/"/\&#34;/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::npm> $line"
            done
          }
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::用 NPM_TOKEN 发布（无 provenance）"
            # setup-node 上面故意没配 registry-url，那这一行的 .npmrc 就得自己写；
            # 只在 token 路径下写，OIDC 路径下 ~/.npmrc 保持"没有 _authToken 键"，npm
            # 才会走 runner 注入的 OIDC token。
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
            set +e
            npm publish --access public >/tmp/publish.log 2>&1
            rc=$?
            set -e
          else
            echo "::notice::用 OIDC trusted publishing 发布（带 provenance）"
            echo "::notice::发布前 ~/.npmrc 内容（应为空或无 _authToken 键）："
            [ -f "$HOME/.npmrc" ] && cat "$HOME/.npmrc" || echo "  (没有 .npmrc 文件)"
            set +e
            npm publish --access public --provenance >/tmp/publish.log 2>&1
            rc=$?
            set -e
          fi
          cat /tmp/publish.log
          if [ "$rc" -ne 0 ]; then
            dump_annotations /tmp/publish.log
            echo "::error::npm publish 退出码 $rc（上面 30 行是完整日志）"
            exit "$rc"
          fi

      - name: verify it landed
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5 6; do
            got="$(npm view "dsh-token-plan-quota@$ver" version 2>/dev/null || true)"
            if [ "$got" = "$ver" ]; then echo "::notice::registry 已有 dsh-token-plan-quota@$ver"; exit 0; fi
            sleep 10
          done
          echo "::error::发布后 60 秒内 registry 查不到 $ver"
          exit 1

      # 只有 registry 真的收到了这个版本才建 GitHub Release，否则 tag 上会挂一条"发出去了"
      # 的说明但 npm 上根本没有 —— 那种不一致比没有更糟。
      - name: build release notes from CHANGELOG
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          node scripts/extract-changelog-section.mjs "$ver" --heading > release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "npm: https://www.npmjs.com/package/dsh-token-plan-quota/v$ver"
            echo ""
            echo "安装：\`dsh plugin add dsh-token-plan-quota\`"
          } >> release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # 只有比现有 latest 新的 tag 才标 latest；回头补发旧版不会把 latest 抢走。
          make_latest: 'true'
