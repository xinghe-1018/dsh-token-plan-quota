name: release

# 浏览器一键发版：在 Actions 页面点 "Run workflow" → 选 patch/minor/major → 跑。
# 与本地 `npm run release` 走同一份 scripts/release.mjs，不复制逻辑。
# 推完 tag 之后 publish.yml 接手（`v*` tag 触发），这一步只负责"切版本 + 打 tag"。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本切哪一位（0.4.5 → 0.4.6 选 patch）'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# 要往 origin 推 commit + tag；actions/checkout 的 persist-credentials（默认 true）
# 会把 GITHUB_TOKEN 写进 remote，release.mjs 里的 `git push` 就直接用它。
permissions:
  contents: write
  # `gh workflow run` 走 Actions 的 dispatch API，没有 actions: write 会被 403。
  # 之前没有这一条，是因为那时假设"推 tag 就会触发 publish"——那个假设是错的（见下面那步）。
  actions: write

jobs:
  release:
    name: bump + tag + push
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— check-docs 会核 CHANGELOG 里的 compare 链接指向真实 tag，
      # 浅克隆里 tag 全"不存在"，`npm run check` 那一步会假阳红。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: release ${{ inputs.bump }}
        run: node scripts/release.mjs --${{ inputs.bump }}

      # 这一步是必需的，不是保险：release.mjs 推 tag 用的凭据来自 actions/checkout 注入的
      # GITHUB_TOKEN，而**用 GITHUB_TOKEN 触发的事件不会新建 workflow run**（GitHub 防递归的
      # 设计；例外只有 workflow_dispatch 与 repository_dispatch）。所以 publish.yml 的
      # `on: push: tags` 在这条路径上永远不会触发——tag 看着推成功了，npm 上却什么都没有。
      # 手推 tag（本地 `git push origin vX.Y.Z`，用人的凭据）不受影响，那条路照旧自动触发。
      - name: dispatch publish（GITHUB_TOKEN 推的 tag 不会自己触发它）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          # dispatch 入口以 package.json 的版本为准（dispatch 时 ref 是分支名，没有 tag 可比），
          # 而 main 此刻已经指向刚推上去的 release commit。
          gh workflow run publish.yml --ref main -f dry_run=false
          echo "::notice::已触发 publish.yml（$tag）：全量 check → npm publish → 回读 registry → 建 GitHub Release。"
          echo "看 https://github.com/${GITHUB_REPOSITORY}/actions"
