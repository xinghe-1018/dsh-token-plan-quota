# dsh-token-plan-quota bundle patch：在 web profile 上插入一行宿主+浏览器双面插件。
#
# 宿主半边（exports "."）：挂 llm/stream 记本地用量账本（月份账 + 供应商 7 天滚动窗口锚点）、
# 观察 llm/retry、可选地用 AK/SK 签名调阿里云 BssOpenApi，并注册只读路由 /token-plan-quota/*；
# 浏览器半边（exports "./client"，由 package.json 的 dsh.client 声明）：在输入框工具行渲染
# **跟随当前模型供应商**的单个额度徽标，点开展全部数据源的明细。
#
# 这里只放真正需要显式声明的东西。**不写 `sources`**：该开哪些源由零配置自动检测按宿主在用的
# 供应商路由决定（baseURL host > 路由名 > Key 前缀，认不准的挂实测窗口）——一旦在这里写死，
# 就等于"用户手写过的清单"，检测只补没覆盖到的路由，反而会盖住自动识别的本意。
# 日常要调的（窗口天数、绑定供应商、强制某几个源）写在 ~/.dsh/token-plan-quota.json
# —— 宿主每次查询前重读那个文件，改完不用重启。
- insert:
    - id: token-plan-quota
      name: dsh-token-plan-quota
      config:
        refreshMinutes: 10
        pollSeconds: 10
